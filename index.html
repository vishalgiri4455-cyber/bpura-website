<style>
:root{
  --green:#2d523c;
  --deep:#142e21;
  --sage:#e8f1eb;
  --cream:#faf7f0;
  --gold:#b88b43;
  --gold-light:#fdf8ed;
  --ink:#223027;
  --muted:#637066;
  --white:#fff;
  --line:#dfe6dc;
  --shadow:0 18px 50px rgba(20,46,33,.12);
  --radius:24px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.topbar{background:linear-gradient(90deg,var(--deep),#1f4733);color:#f7f3e9;text-align:center;padding:9px 14px;font-size:12px;letter-spacing:.09em;font-weight:600}
.header{position:sticky;top:0;z-index:20;background:rgba(250,247,240,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1180px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--deep)}
.brand-mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f4e3ed,#dbeade);color:#7b3471;font-family:Georgia,serif;font-size:26px;border:1px solid #ead3e4;box-shadow:0 4px 12px rgba(123,52,113,.1)}
.brand strong{display:block;font-family:Georgia,serif;font-size:23px;letter-spacing:.04em;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.navlinks{display:flex;gap:22px;align-items:center}
.navlinks a{color:#36483d;text-decoration:none;font-size:13px;font-weight:650;transition:.2s}
.navlinks a:hover{color:var(--gold)}
.nav-actions{display:flex;gap:10px;align-items:center}
.iconbtn,.menu-btn,.wholesale-nav-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;color:var(--deep);font-weight:700;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.wholesale-nav-btn{background:var(--gold-light);border-color:#e2cca2;color:#8a6220}
.cart-count{display:inline-grid;place-items:center;background:var(--green);color:white;width:22px;height:22px;border-radius:50%;font-size:11px;margin-left:6px;font-weight:800}
.menu-btn{display:none}

/* Hero Section */
.hero{background:linear-gradient(120deg,#f3ede1 0%,#e7efe5 55%,#f9f3e6 100%);position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-inner{max-width:1180px;margin:auto;padding:70px 22px 65px;display:grid;grid-template-columns:1.1fr 0.9fr;align-items:center;gap:40px;min-height:520px}
.eyebrow{color:#8c743e;text-transform:uppercase;letter-spacing:.2em;font-size:11px;font-weight:800}
.hero h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(42px,5.5vw,72px);line-height:1.02;letter-spacing:-.04em;color:var(--deep);margin:16px 0}
.hero h1 em{color:#8b4779;font-style:normal}
.hero p{max-width:500px;color:#526356;font-size:17px;margin:0 0 28px}
.btn{border:0;border-radius:999px;padding:14px 26px;background:var(--green);color:#fff;font-weight:750;box-shadow:0 8px 22px rgba(45,82,60,.2);transition:.25s}
.btn:hover{transform:translateY(-2px);background:var(--deep)}
.btn.secondary{background:#fff;color:var(--deep);border:1px solid #c9d8c8;box-shadow:none}
.btn.gold{background:var(--gold);color:#fff;box-shadow:0 8px 22px rgba(184,139,67,.25)}
.btn.gold:hover{background:#9e7535}
.hero-buttons{display:flex;gap:12px;flex-wrap:wrap}
.hero-visual{position:relative;display:grid;place-items:center}
.hero-visual img{width:min(100%,480px);height:390px;object-fit:contain;filter:drop-shadow(0 22px 30px rgba(20,46,33,.18));border-radius:20px}
.hero-note{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.95);border:1px solid #dbe6d9;border-radius:18px;padding:12px 18px;box-shadow:var(--shadow);font-size:12px;color:var(--muted);backdrop-filter:blur(8px)}
.hero-note b{display:block;color:var(--deep);font-size:16px}

/* Trust Bar */
.trustbar{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 20px rgba(0,0,0,.02)}
.trustbar-inner{max-width:1180px;margin:auto;padding:18px 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.trust-item{text-align:center;color:#4f6154;font-size:13px;font-weight:700}
.trust-item span{display:block;color:var(--gold);font-size:20px;margin-bottom:4px}

/* Sections */
.section{max-width:1180px;margin:auto;padding:80px 22px}
.section-head{text-align:center;max-width:700px;margin:0 auto 40px}
.section-head .eyebrow{color:#8c743e}
.section h2{font-family:Georgia,serif;font-weight:500;font-size:clamp(32px,4vw,46px);color:var(--deep);margin:8px 0 12px;letter-spacing:-.03em}
.section-head p{color:var(--muted);margin:0;font-size:15px}

/* Combo & Wholesale Banners */
.combo-banner{background:linear-gradient(135deg,#fcf4e8,#f3e5cb);border:1px solid #dfcca5;border-radius:var(--radius);padding:32px;margin-bottom:40px;display:flex;justify-content:space-between;align-items:center;gap:24px;box-shadow:0 10px 30px rgba(184,139,67,.08)}
.combo-banner h3{font-family:Georgia,serif;font-size:28px;color:var(--deep);margin:0 0 8px}
.combo-banner p{color:#6b5a3d;margin:0;font-size:14px}

.wholesale-banner{background:linear-gradient(135deg,#142e21,#214a34);color:#fff;border-radius:var(--radius);padding:35px;margin-top:45px;display:flex;justify-content:space-between;align-items:center;gap:24px;box-shadow:0 15px 40px rgba(20,46,33,.15)}
.wholesale-banner h3{font-family:Georgia,serif;font-size:28px;margin:0 0 8px;color:#fff}
.wholesale-banner p{color:#d1ddd2;margin:0;font-size:14px}

/* Product Grid */
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.product-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:0 8px 30px rgba(20,46,33,.05);transition:.25s;display:flex;flex-direction:column}
.product-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.product-image{height:270px;background:#f5f4ee;position:relative;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:cover;object-position:center}
.product-image .weight-tag{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.94);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;color:var(--deep);box-shadow:0 4px 10px rgba(0,0,0,.06)}
.product-body{padding:20px;display:flex;flex-direction:column;flex:1}
.product-body h3{font-family:Georgia,serif;font-weight:500;font-size:21px;margin:0 0 4px;color:var(--deep)}
.product-body .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
.price-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.price{font-size:22px;font-weight:850;color:var(--deep)}
.price small{font-size:11px;color:var(--muted);font-weight:500}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.badge{font-size:10px;border:1px solid #d2e4d0;color:#285737;background:#edf6eb;border-radius:999px;padding:4px 9px;font-weight:750}
.ingredients{border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.ingredients summary{font-size:12px;color:var(--green);font-weight:800;cursor:pointer}
.ingredients p{font-size:11px;color:#617066;margin:7px 0 14px}
.add-btn{width:100%;padding:12px;border:0;border-radius:14px;background:var(--deep);color:white;font-weight:750;transition:.2s}
.add-btn:hover{background:var(--green)}

/* Story Section */
.story{background:linear-gradient(135deg,#f4ede0,#eef4ec);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.story-inner{max-width:1180px;margin:auto;padding:85px 22px;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.story-image img{width:100%;max-height:500px;object-fit:cover;border-radius:28px;box-shadow:var(--shadow)}
.story-copy p{color:#58675c;font-size:15px}
.story-points{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0}
.point{background:#fff;border:1px solid #dce4da;border-radius:18px;padding:16px;font-size:12px;color:#5a695e;box-shadow:0 4px 15px rgba(0,0,0,.02)}
.point b{display:block;color:var(--deep);font-size:14px;margin-bottom:4px}

/* Care Gallery */
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.gallery-card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 8px 25px rgba(20,46,33,.05);transition:.25s}
.gallery-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.gallery-card img{width:100%;height:380px;object-fit:cover;display:block}
.gallery-card .info{padding:16px 20px;font-size:14px;color:var(--deep);font-weight:750;background:#fff;border-top:1px solid var(--line)}

/* Delivery Strip */
.delivery-strip{background:var(--deep);color:#fff}
.delivery-inner{max-width:1180px;margin:auto;padding:50px 22px;display:flex;justify-content:space-between;align-items:center;gap:30px}
.delivery-inner h2{font-family:Georgia,serif;font-weight:500;font-size:32px;margin:0 0 6px;color:#fff}
.delivery-inner p{color:#cfe0d1;margin:0;font-size:14px}
.delivery-pill{border:1px solid #486f58;background:#1a3829;padding:14px 22px;border-radius:999px;white-space:nowrap;font-size:14px;font-weight:750;color:#f3f7f4}

/* Footer */
.footer{background:#0e2118;color:#d1e0d3;padding:55px 22px 25px}
.footer-inner{max-width:1180px;margin:auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px}
.footer h3{font-family:Georgia,serif;font-size:24px;margin:0 0 12px;color:white}
.footer p,.footer a{font-size:13px;color:#abc0af}
.footer a{display:block;text-decoration:none;margin:8px 0;transition:.2s}
.footer a:hover{color:#fff}
.copyright{max-width:1180px;margin:35px auto 0;padding-top:18px;border-top:1px solid #1f3b2d;font-size:12px;color:#859e89}

/* Cart & Modals */
.overlay{position:fixed;inset:0;background:rgba(10,24,17,.6);z-index:40;display:none;justify-content:flex-end;backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.drawer{background:white;width:min(520px,100%);height:100%;overflow:auto;padding:28px;box-shadow:-20px 0 50px rgba(0,0,0,.2)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}
.drawer-head h2{font-family:Georgia,serif;font-weight:500;color:var(--deep);margin:0;font-size:28px}
.close{border:0;background:#f0f5f1;border-radius:50%;width:38px;height:38px;font-size:20px;font-weight:700;color:var(--deep)}
.cart-items{padding:16px 0}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.cart-item{display:grid;grid-template-columns:70px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.cart-item img{width:70px;height:70px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.cart-item b{display:block;color:var(--deep);font-size:14px}
.cart-item small{color:var(--muted);font-size:11px}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty button{width:26px;height:26px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:700}
.remove{border:0;background:none;color:#b84040;font-size:11px;margin-left:6px;font-weight:700}
.summary{border-top:1px solid var(--line);padding-top:16px}
.sumline{display:flex;justify-content:space-between;gap:15px;margin:8px 0;font-size:13px;color:#5a695e}
.sumline.total{font-size:19px;color:var(--deep);font-weight:850;border-top:1px dashed #d5ded4;padding-top:14px;margin-top:14px}
.muted-note{font-size:11px;color:#738276}
.checkout-form{margin-top:22px}
.checkout-form h3{font-family:Georgia,serif;font-weight:500;color:var(--deep);font-size:22px;margin:18px 0 10px}
.field{margin:11px 0}
.field label{display:block;font-size:11px;font-weight:800;color:#4f6154;margin-bottom:6px;letter-spacing:.05em}
.field input,.field textarea,.field select{width:100%;border:1px solid #ccd6cb;border-radius:12px;padding:12px 14px;outline:none;background:#fff;color:var(--ink)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(45,82,60,.12)}
.field textarea{min-height:78px;resize:vertical}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.delivery-calc{background:#edf5ee;border:1px solid #d2e4d0;border-radius:16px;padding:15px;margin:14px 0}
.delivery-calc .sumline{margin:4px 0}
.pay-options{display:grid;gap:10px;margin:12px 0}
.pay-option{border:1px solid #ccd6cb;border-radius:14px;padding:14px;display:flex;gap:10px;align-items:flex-start;font-size:12px;background:#fff}
.pay-option input{margin-top:3px;accent-color:var(--green)}
.pay-option b{display:block;font-size:13px;color:var(--deep)}
.upi-box{background:#fdf8ec;border:1px dashed #dfcca5;padding:14px;border-radius:14px;font-size:12px;display:none;margin-top:10px}
.upi-box.show{display:block}
.copy-btn{border:1px solid #dfcca5;border
